name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply production database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          missing=()
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -n "$SUPABASE_DB_PASSWORD" ]] || missing+=("SUPABASE_DB_PASSWORD")
          [[ -n "$SUPABASE_PROJECT_ID" ]] || missing+=("SUPABASE_PROJECT_ID")

          if ((${#missing[@]})); then
            echo "::error title=Supabase migration deploy blocked::Configure these GitHub repository secrets to enable deployment: ${missing[*]}"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Review pending migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase migration list \
            --remote="$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db push \
            --remote="$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run

      - name: Apply pending migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase db push \
            --remote="$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes
